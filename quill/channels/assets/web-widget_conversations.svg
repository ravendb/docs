<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="380" viewBox="0 0 1030 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1030" height="380" fill="#eaf3fa"/>
  <!-- Your website page: one embed link is placed on the page, so all of its visitors share one conversation -->
  <g id="your-website-page">
    <rect x="30" y="30" width="350" height="320" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="48" y="62" font-size="18" font-weight="bold" fill="#1e293b">Your website page</text>
  </g>
  <g id="page-visitors">
    <circle cx="68" cy="169" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <path d="M 55 191 a 13 13 0 0 1 26 0" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <circle cx="102" cy="169" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <path d="M 89 191 a 13 13 0 0 1 26 0" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <circle cx="136" cy="169" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <path d="M 123 191 a 13 13 0 0 1 26 0" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    <line x1="160" y1="180" x2="186" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <rect x="193" y="155" width="150" height="50" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="268" y="177" text-anchor="middle" font-size="17" fill="#1e293b">Chat box</text>
    <text x="268" y="197" text-anchor="middle" font-size="16" fill="#1e293b">Embed link</text>
  </g>
  <text x="205" y="290" text-anchor="middle" font-size="17" fill="#1e293b">All page visitors share the chat box</text>
  <text x="205" y="313" text-anchor="middle" font-size="17" fill="#1e293b">and the conversation</text>

  <!-- Quill: the web widget channel carrying the single conversation, and the agent -->
  <g id="quill-container">
    <rect x="510" y="30" width="490" height="320" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="528" y="62" font-size="18" font-weight="bold" fill="#9a3412">Quill</text>
  </g>
  <g id="web-widget-channel">
    <rect x="530" y="95" width="200" height="190" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="630" y="128" text-anchor="middle" font-size="18" fill="#1e293b">Web widget channel</text>
  </g>
  <g id="agent">
    <rect x="770" y="120" width="210" height="120" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="875" y="175" text-anchor="middle" font-size="18" fill="#1e293b">Agent</text>
    <text x="875" y="200" text-anchor="middle" font-size="16" fill="#1e293b">Answers all conversations</text>
  </g>
  <g id="internal-database">
    <rect x="770" y="280" width="210" height="55" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="875" y="314" text-anchor="middle" font-size="17" fill="#1e293b">Internal database</text>
  </g>
  <line x1="875" y1="242" x2="875" y2="278" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="886" y="265" font-size="16" fill="#1e293b">Queries</text>
  <g id="conversations" stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="345" y1="180" x2="528" y2="180" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g id="conversation-labels" font-size="17" fill="#1e293b" text-anchor="middle">
    <text x="445" y="170">Conversation</text>
  </g>
  <g id="threads-in-channel" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="548" y1="180" x2="712" y2="180"/>
  </g>
  <g id="channel-to-agent" stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="732" y1="180" x2="768" y2="180" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
</svg>
