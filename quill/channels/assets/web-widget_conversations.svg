<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#eaf3fa"/>

  <!-- Your website: three pages, each holding a chat box opened through its own embed link -->
  <g id="your-website">
    <rect x="30" y="30" width="300" height="360" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="46" y="56" font-size="14" font-weight="bold" fill="#1e293b">Your website</text>
  </g>

  <g id="chat-box-1">
    <rect x="50" y="124" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="62" y="154" font-size="12" fill="#475569">Page 1</text>
    <rect x="120" y="130" width="170" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="205" y="147" text-anchor="middle" font-size="13" fill="#1e293b">Chat box</text>
    <text x="205" y="162" text-anchor="middle" font-size="11" fill="#475569">embed link 1</text>
  </g>
  <g id="chat-box-2">
    <rect x="50" y="184" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="62" y="214" font-size="12" fill="#475569">Page 2</text>
    <rect x="120" y="190" width="170" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="205" y="207" text-anchor="middle" font-size="13" fill="#1e293b">Chat box</text>
    <text x="205" y="222" text-anchor="middle" font-size="11" fill="#475569">embed link 2</text>
  </g>
  <g id="chat-box-3">
    <rect x="50" y="244" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="62" y="274" font-size="12" fill="#475569">Page 3</text>
    <rect x="120" y="250" width="170" height="40" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="205" y="267" text-anchor="middle" font-size="13" fill="#1e293b">Chat box</text>
    <text x="205" y="282" text-anchor="middle" font-size="11" fill="#475569">embed link 3</text>
  </g>

  <!-- Quill: the web widget channel carrying one conversation per chat box, and the agent -->
  <g id="quill-container">
    <rect x="400" y="30" width="470" height="360" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="416" y="56" font-size="14" font-weight="bold" fill="#9a3412">Quill</text>
  </g>

  <g id="web-widget-channel">
    <rect x="420" y="75" width="200" height="235" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="520" y="100" text-anchor="middle" font-size="15" fill="#1e293b">Web widget channel</text>
  </g>

  <!-- One conversation per chat box, carried through the channel to the agent -->
  <g id="conversations" stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="292" y1="150" x2="418" y2="150" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="292" y1="210" x2="418" y2="210" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="292" y1="270" x2="418" y2="270" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g id="conversation-labels" font-size="11" fill="#475569" text-anchor="middle">
    <text x="355" y="142">conversation 1</text>
    <text x="355" y="202">conversation 2</text>
    <text x="355" y="262">conversation 3</text>
  </g>
  <g id="threads-in-channel" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="436" y1="150" x2="604" y2="150"/>
    <line x1="436" y1="210" x2="604" y2="210"/>
    <line x1="436" y1="270" x2="604" y2="270"/>
  </g>
  <g id="channel-to-agent" stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="622" y1="150" x2="658" y2="150" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="622" y1="210" x2="658" y2="210" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="622" y1="270" x2="658" y2="270" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <g id="agent">
    <rect x="660" y="120" width="190" height="180" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="755" y="205" text-anchor="middle" font-size="15" fill="#1e293b">Agent</text>
    <text x="755" y="225" text-anchor="middle" font-size="11" fill="#475569">answers all conversations</text>
  </g>

  <g id="internal-database">
    <rect x="660" y="330" width="190" height="45" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="755" y="358" text-anchor="middle" font-size="14" fill="#1e293b">Internal database</text>
  </g>
  <line x1="755" y1="302" x2="755" y2="328" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="765" y="320" font-size="11" fill="#475569">queries</text>
</svg>
